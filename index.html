<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Westminster Timetable</title>

<style>
:root{
  --blue:#3f91d6;
  --border:#ccc;
  --grid:#ddd;
  --text:#333;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  color:var(--text);
  background:#fff;
}

.page{
  max-width:900px;
  margin:auto;
}

/* HEADER */

header{
  height:72px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:6px 10px;
  border-bottom:1px solid #ddd;
}

.logo{
  font-weight:800;
  font-size:25px;
  line-height:.9;
  letter-spacing:-1.5px;
  color:#111;
}

.logo span{
  display:block;
}

.menu{
  border:0;
  background:var(--blue);
  color:white;
  border-radius:5px;
  font-size:28px;
  width:45px;
  height:48px;
  cursor:pointer;
}

/* NAVIGATION */

.toolbar{
  height:53px;
  background:var(--blue);
  margin:10px 10px 0;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 10px;
  border-radius:5px 5px 0 0;
}

.tools{
  display:flex;
  gap:12px;
}

.tool{
  width:35px;
  height:35px;
  border-radius:50%;
  border:1px solid white;
  background:transparent;
  color:white;
  font-size:19px;
  cursor:pointer;
}

/* DATE */

.datebar{
  margin:0 10px;
  height:34px;
  border:1px solid var(--border);
  background:#f7f7f7;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--blue);
  font-weight:bold;
}

/* TIMETABLE */

.schedule-wrap{
  height:calc(100vh - 260px);
  min-height:520px;
  overflow:auto;
  margin:0 10px;
  border:1px solid var(--border);
  border-top:0;
}

.schedule{
  position:relative;
  min-width:430px;
  height:1365px;
}

.hour{
  height:105px;
  display:grid;
  grid-template-columns:55px 1fr;
  border-bottom:1px solid var(--border);
}

.time{
  padding:10px 8px 0 0;
  text-align:right;
  color:var(--blue);
  font-weight:bold;
  font-size:13px;
  border-right:1px solid var(--border);
}

.time small{
  font-size:9px;
}

.slot{
  position:relative;
  background:
    repeating-linear-gradient(
      to bottom,
      transparent 0,
      transparent 25px,
      var(--grid) 25px,
      var(--grid) 26px
    );
}

/* CLASS BOX */

.event{
  position:absolute;
  left:7px;
  right:7px;
  border-left:4px solid var(--blue);
  background:#eaf4fd;
  border-radius:2px;
  padding:7px 8px;
  color:#236b9f;
  font-size:13px;
  line-height:18px;
  overflow:hidden;
  box-shadow:0 0 0 1px #d8eaf7;
}

.event strong{
  display:block;
  font-size:14px;
}

.event small{
  display:block;
  color:#555;
  margin-top:2px;
}

/* FOOTER */

.footer{
  text-align:center;
  padding:9px 10px 15px;
  font-size:13px;
}

.updated{
  color:var(--blue);
  font-weight:bold;
  line-height:18px;
}

.links{
  margin-top:8px;
  display:flex;
  justify-content:center;
  gap:18px;
  align-items:center;
}

.cmis{
  font-size:28px;
  font-weight:800;
  letter-spacing:-2px;
}

.cmis em{
  font-style:normal;
  color:#e64e57;
}

.copy{
  font-size:10px;
  color:#777;
  margin-top:6px;
  line-height:13px;
}

/* MENU */

.drawer{
  position:fixed;
  top:0;
  right:-280px;
  width:270px;
  height:100%;
  background:#fff;
  box-shadow:-3px 0 12px #0003;
  z-index:10;
  padding:20px;
  transition:.2s;
}

.drawer.open{
  right:0;
}

.drawer button{
  width:100%;
  padding:12px;
  margin:6px 0;
  border:1px solid #ddd;
  background:#f7f7f7;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="page">

<header>

  <div class="logo">
    <span>UNIVERSITY OF</span>
    <span>WESTMINSTER ▦</span>
  </div>

  <button class="menu" id="menu">≡</button>

</header>


<div class="toolbar">

  <div class="tools">
    <button class="tool" id="prev">←</button>
    <button class="tool" id="today">▦</button>
  </div>

  <div class="tools">
    <button class="tool" id="jump">⌖</button>
    <button class="tool" id="next">→</button>
  </div>

</div>


<div class="datebar" id="date"></div>


<div class="schedule-wrap" id="scroll">

  <div class="schedule" id="schedule"></div>

</div>


<footer class="footer">

  <div class="updated">
    Timetabled events last full update 5:20 am on 7<br>
    September 2026
  </div>

  <div class="links">

    <span>Accessibility statement</span>

    <span class="cmis">
      cmis<em>go</em>
    </span>

    <span>About</span>

  </div>

  <div class="copy">
    © Copyright - Advanced Computer Software Group Ltd All Rights Reserved.<br>
    Advanced is a trading name of Advanced Business Software and Solutions Limited.
  </div>

</footer>

</div>


<!-- SIDE MENU -->

<div class="drawer" id="drawer">

  <button id="close">Close</button>

  <button>Timetable</button>

  <button>Calendar</button>

  <button>Settings</button>

</div>


<script>

/* =====================================================
   YOUR TIMETABLE
   ===================================================== */

const events = [

  ["2026-09-14","10:00","12:00","Welcome & Induction"],

  ["2026-09-15","14:00","15:00","Course Introduction"],

  ["2026-09-17","14:00","16:00","Student Induction"],


  ["2026-09-22","14:00","15:00","Lecture"],

  ["2026-09-24","14:00","17:00","Seminar"],


  ["2026-09-29","14:00","15:00","Lecture"],

  ["2026-10-01","14:00","17:00","Seminar"],


  ["2026-10-06","14:00","15:00","Lecture"],

  ["2026-10-08",null,null,"No scheduled class"],


  ["2026-10-13","14:00","15:00","Lecture"],

  ["2026-10-15","14:00","17:00","Seminar"],


  ["2026-10-20","14:00","15:00","Lecture"],

  ["2026-10-22","15:00","17:00","Workshop"],


  ["2026-10-27",null,null,"Independent Study"],

  ["2026-10-29","14:00","17:00","Seminar"],


  ["2026-11-03","14:00","15:00","Lecture"],

  ["2026-11-05","14:00","17:00","Seminar"],


  ["2026-11-10","14:00","15:00","Lecture"],

  ["2026-11-12",null,null,"No scheduled class"],


  ["2026-11-17","14:00","15:00","Lecture"],

  ["2026-11-19","14:00","17:00","Seminar"],


  ["2026-11-24","14:00","15:00","Lecture"],

  ["2026-11-26","13:00","16:00","Workshop"],


  ["2026-12-01",null,null,"Independent Study"],

  ["2026-12-03","14:00","17:00","Seminar"],


  ["2026-12-08","14:00","15:00","Final Lecture"],

  ["2026-12-10","14:00","16:00","Revision / Exam Preparation"],


  ["2026-12-11",null,null,"Semester 1 Teaching Ends"],


  ["2027-01-04",null,null,"Semester 1 Exam Period"],

  ["2027-01-15",null,null,"Semester 1 Exam Period"]

];


/* =====================================================
   TIMETABLE SETTINGS
   ===================================================== */

const startHour = 8;
const endHour = 21;
const rowHeight = 105;

const schedule = document.getElementById("schedule");
const scroll = document.getElementById("scroll");
const dateElement = document.getElementById("date");


/* START DATE */

let selectedDate = new Date("2026-09-14T12:00:00");


/* =====================================================
   DATE FUNCTIONS
   ===================================================== */

function formatDate(date){

  return date.toLocaleDateString(
    "en-GB",
    {
      weekday:"short",
      day:"numeric",
      month:"short",
      year:"numeric"
    }
  );

}


function dateKey(date){

  return date.toISOString().slice(0,10);

}


/* =====================================================
   CONVERT TIME TO MINUTES
   ===================================================== */

function minutes(time){

  if(!time){
    return 0;
  }

  const parts = time.split(":");

  return Number(parts[0]) * 60 + Number(parts[1]);

}


/* =====================================================
   BUILD TIMETABLE
   ===================================================== */

function buildTimetable(){

  schedule.innerHTML = "";


  /* HOURS */

  for(let hour = startHour; hour <= endHour; hour++){

    const row = document.createElement("div");

    row.className = "hour";


    const time = document.createElement("div");

    time.className = "time";


    const shownHour = hour % 12 || 12;

    const ampm = hour >= 12 ? "PM" : "AM";


    time.innerHTML =
      shownHour +
      "<small>" +
      ampm +
      "</small>";


    const slot = document.createElement("div");

    slot.className = "slot";


    row.appendChild(time);

    row.appendChild(slot);

    schedule.appendChild(row);

  }


  /* GET EVENTS FOR CURRENT DAY */

  const today = dateKey(selectedDate);

  const todaysEvents =
    events.filter(event => event[0] === today);


  /* ADD EVENTS */

  todaysEvents.forEach(eventData => {

    const [
      date,
      start,
      end,
      title
    ] = eventData;


    const event = document.createElement("div");

    event.className = "event";


    /* EVENTS WITHOUT A TIME */

    if(!start){

      event.style.top = "8px";

      event.style.left = "62px";

      event.style.right = "8px";

      event.style.minHeight = "42px";


      event.innerHTML =
        "<strong>" +
        title +
        "</strong>";

    }


    /* EVENTS WITH A TIME */

    else{

      const startPosition =
        (minutes(start) -
        startHour * 60)
        / 60 *
        rowHeight;


      const duration =
        (minutes(end) -
        minutes(start))
        / 60 *
        rowHeight;


      event.style.top =
        startPosition + "px";


      event.style.height =
        Math.max(45,duration - 5) + "px";


      event.innerHTML =
        "<strong>" +
        title +
        "</strong>" +

        "<small>" +
        start +
        "–" +
        end +
        "</small>";

    }


    schedule.appendChild(event);

  });


  /* UPDATE DATE */

  dateElement.textContent =
    formatDate(selectedDate);


  /* START AT TOP */

  scroll.scrollTop = 0;

}


/* =====================================================
   PREVIOUS / NEXT DAY
   ===================================================== */

function changeDay(amount){

  selectedDate.setDate(
    selectedDate.getDate() + amount
  );

  buildTimetable();

}


document.getElementById("prev").onclick =
  () => changeDay(-1);


document.getElementById("next").onclick =
  () => changeDay(1);


/* =====================================================
   HOME / FIRST DAY
   ===================================================== */

document.getElementById("today").onclick = () => {

  selectedDate =
    new Date("2026-09-14T12:00:00");

  buildTimetable();

};


/* =====================================================
   JUMP TO CLASS
   ===================================================== */

document.getElementById("jump").onclick = () => {

  const today = dateKey(selectedDate);

  const firstClass =
    events.find(
      event =>
        event[0] === today &&
        event[1]
    );


  if(firstClass){

    const position =
      (minutes(firstClass[1]) -
      startHour * 60)
      / 60 *
      rowHeight;


    scroll.scrollTo({

      top:Math.max(
        0,
        position - 100
      ),

      behavior:"smooth"

    });

  }

};


/* =====================================================
   MENU
   ===================================================== */

const drawer =
  document.getElementById("drawer");


document.getElementById("menu").onclick =
  () => drawer.classList.add("open");


document.getElementById("close").onclick =
  () => drawer.classList.remove("open");


/* =====================================================
   INITIALISE
   ===================================================== */

buildTimetable();

</script>

</body>
</html>
